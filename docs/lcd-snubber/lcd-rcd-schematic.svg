<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="599" fill="none" stroke="#d5d9e0"/>
  <text x="24" y="38" font-size="19" font-weight="700" fill="#111827">플라이백 LCD + RCD 클램프 회로</text>
  <text x="24" y="58" font-size="12" fill="#6b7280">입력 18~50 V (MPPT 30~37.6 V) · 출력 342 V / 250 W 피크 · 100 kHz 가정</text>

  <!-- 영역 -->
  <rect x="170" y="150" width="206" height="352" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="172" y="143" font-size="13" font-weight="700" fill="#1d4ed8">LCD 스너버</text>
  <rect x="396" y="100" width="190" height="204" fill="#fff7ed" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="500" y="321" font-size="13" font-weight="700" fill="#b45309">RCD 클램프</text>

  <!-- 주 회로 -->
  <g fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="90" y1="90" x2="660" y2="90"/>
    <line x1="90" y1="520" x2="660" y2="520"/>
    <line x1="150" y1="90" x2="150" y2="298"/>
    <line x1="136" y1="298" x2="164" y2="298"/>
    <line x1="136" y1="312" x2="164" y2="312"/>
    <line x1="150" y1="312" x2="150" y2="520"/>
    <line x1="660" y1="90" x2="660" y2="112"/>
    <path d="M660 112 a8 8 0 0 1 0 16 a8 8 0 0 1 0 16 a8 8 0 0 1 0 16"/>
    <line x1="660" y1="160" x2="660" y2="190"/>
    <path d="M660 190 a10 10 0 0 1 0 20 a10 10 0 0 1 0 20 a10 10 0 0 1 0 20 a10 10 0 0 1 0 20 a10 10 0 0 1 0 20"/>
    <line x1="660" y1="290" x2="660" y2="392"/>
    <line x1="690" y1="186" x2="690" y2="294"/>
    <line x1="698" y1="186" x2="698" y2="294"/>
    <path d="M730 190 a10 10 0 0 0 0 20 a10 10 0 0 0 0 20 a10 10 0 0 0 0 20 a10 10 0 0 0 0 20 a10 10 0 0 0 0 20"/>
    <line x1="730" y1="190" x2="780" y2="190"/>
    <line x1="804" y1="178" x2="804" y2="202"/>
    <line x1="804" y1="190" x2="1016" y2="190"/>
    <line x1="730" y1="290" x2="1016" y2="290"/>
    <line x1="900" y1="190" x2="900" y2="233"/>
    <line x1="886" y1="233" x2="914" y2="233"/>
    <line x1="886" y1="247" x2="914" y2="247"/>
    <line x1="900" y1="247" x2="900" y2="290"/>
    <line x1="660" y1="392" x2="676" y2="392"/>
    <line x1="660" y1="420" x2="660" y2="520"/>
    <line x1="660" y1="448" x2="676" y2="448"/>
    <line x1="660" y1="420" x2="669" y2="420"/>
    <line x1="676" y1="386" x2="676" y2="454" stroke-width="3"/>
    <line x1="684" y1="392" x2="684" y2="448"/>
    <line x1="684" y1="420" x2="728" y2="420"/>
    <line x1="320" y1="520" x2="320" y2="534"/>
    <line x1="306" y1="534" x2="334" y2="534"/>
    <line x1="311" y1="540" x2="329" y2="540"/>
    <line x1="316" y1="546" x2="324" y2="546"/>
    <!-- 드레인 노드 배선 -->
    <line x1="331" y1="330" x2="660" y2="330"/>
  </g>
  <polygon points="780,178 780,202 804,190" fill="#1f2937"/>
  <polygon points="669,415 669,425 676,420" fill="#1f2937"/>

  <!-- LCD -->
  <g fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="330" x2="250" y2="222"/>
    <line x1="238" y1="198" x2="262" y2="198"/>
    <line x1="250" y1="198" x2="250" y2="90"/>
    <line x1="250" y1="330" x2="250" y2="350"/>
    <path d="M250 350 a8 8 0 0 1 0 16 a8 8 0 0 1 0 16 a8 8 0 0 1 0 16 a8 8 0 0 1 0 16"/>
    <line x1="250" y1="414" x2="250" y2="450"/>
    <line x1="238" y1="450" x2="262" y2="450"/>
    <line x1="250" y1="474" x2="250" y2="520"/>
    <line x1="250" y1="330" x2="319" y2="330"/>
    <line x1="319" y1="316" x2="319" y2="344"/>
    <line x1="331" y1="316" x2="331" y2="344"/>
  </g>
  <polygon points="238,222 262,222 250,198" fill="#1d4ed8"/>
  <polygon points="238,474 262,474 250,450" fill="#1d4ed8"/>

  <!-- RCD -->
  <g fill="none" stroke="#b45309" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="490" y1="330" x2="490" y2="282"/>
    <line x1="478" y1="258" x2="502" y2="258"/>
    <line x1="490" y1="258" x2="490" y2="232"/>
    <line x1="470" y1="232" x2="510" y2="232"/>
    <!-- Cc -->
    <line x1="470" y1="232" x2="470" y2="180"/>
    <line x1="457" y1="180" x2="483" y2="180"/>
    <line x1="457" y1="168" x2="483" y2="168"/>
    <line x1="470" y1="168" x2="470" y2="112"/>
    <!-- Rc -->
    <line x1="510" y1="232" x2="510" y2="196"/>
    <path d="M510 196 l-7 -4 l14 -8 l-14 -8 l14 -8 l-14 -8 l14 -8 l-7 -4"/>
    <line x1="510" y1="148" x2="510" y2="112"/>
    <line x1="470" y1="112" x2="510" y2="112"/>
    <line x1="490" y1="112" x2="490" y2="90"/>
  </g>
  <polygon points="478,282 502,282 490,258" fill="#b45309"/>

  <!-- 접점 -->
  <g fill="#1f2937">
    <circle cx="150" cy="90" r="4"/><circle cx="150" cy="520" r="4"/>
    <circle cx="250" cy="90" r="4"/><circle cx="250" cy="520" r="4"/>
    <circle cx="660" cy="330" r="4"/><circle cx="320" cy="520" r="4"/>
    <circle cx="490" cy="90" r="4"/><circle cx="490" cy="330" r="4"/>
    <circle cx="900" cy="190" r="4"/><circle cx="900" cy="290" r="4"/>
    <circle cx="647" cy="197" r="3.5"/><circle cx="743" cy="283" r="3.5"/>
  </g>
  <circle cx="250" cy="330" r="4.5" fill="#1d4ed8"/>
  <circle cx="490" cy="232" r="4.5" fill="#b45309"/>
  <g fill="#ffffff" stroke="#1f2937" stroke-width="2">
    <circle cx="90" cy="90" r="5"/><circle cx="90" cy="520" r="5"/>
    <circle cx="1020" cy="190" r="5"/><circle cx="1020" cy="290" r="5"/>
  </g>

  <!-- 라벨 -->
  <g font-size="12.5" fill="#111827">
    <text x="78" y="82" text-anchor="end" font-weight="700">Vin+</text>
    <text x="78" y="540" text-anchor="end" font-weight="700">GND</text>
    <text x="24" y="210" fill="#374151">PV 입력</text>
    <text x="24" y="228" fill="#374151">18~50 V</text>
    <text x="132" y="309" text-anchor="end">Cin</text>
    <text x="644" y="134" text-anchor="end">Llk</text>
    <text x="644" y="150" text-anchor="end" fill="#4b5563">0.16 µH</text>
    <text x="640" y="240" text-anchor="end">Lp 12 µH</text>
    <text x="640" y="257" text-anchor="end" fill="#4b5563">Np 4T</text>
    <text x="748" y="238">Ns 30T</text>
    <text x="694" y="176" text-anchor="middle" fill="#4b5563">T1</text>
    <text x="792" y="168" text-anchor="middle">D3</text>
    <text x="834" y="168" fill="#4b5563">SiC 1200 V</text>
    <text x="922" y="244">Cf</text>
    <text x="1032" y="186" font-weight="700">PHV+</text>
    <text x="1032" y="294" font-weight="700">PHV−</text>
    <text x="1032" y="232" fill="#374151">342 V 피크 / 250 W 피크</text>
    <text x="1032" y="250" fill="#374151">→ 언폴더</text>
    <text x="672" y="326">드레인</text>
    <text x="648" y="412" text-anchor="end">Q1</text>
    <text x="648" y="428" text-anchor="end" fill="#4b5563">150 V</text>
    <text x="734" y="424" fill="#4b5563">PWM</text>
  </g>
  <g font-size="12.5" fill="#1d4ed8">
    <text x="226" y="207" text-anchor="end" font-weight="700">D1</text>
    <text x="226" y="223" text-anchor="end">200 V / 5 A</text>
    <text x="236" y="324" text-anchor="end" font-weight="700">X</text>
    <text x="226" y="378" text-anchor="end" font-weight="700">Ls</text>
    <text x="226" y="394" text-anchor="end">10 µH</text>
    <text x="226" y="459" text-anchor="end" font-weight="700">D2</text>
    <text x="226" y="475" text-anchor="end">200 V / 5 A</text>
    <text x="325" y="290" text-anchor="middle" font-weight="700">Cs 82.5 nF</text>
    <text x="325" y="306" text-anchor="middle">330 nF × 4 직렬</text>
    <text x="325" y="362" text-anchor="middle">PP 필름</text>
  </g>
  <g font-size="12.5" fill="#b45309">
    <text x="472" y="266" text-anchor="end" font-weight="700">Dc</text>
    <text x="472" y="282" text-anchor="end">200 V / 2 A</text>
    <text x="452" y="170" text-anchor="end" font-weight="700">Cc</text>
    <text x="452" y="186" text-anchor="end">100 nF</text>
    <text x="524" y="168" font-weight="700">Rc</text>
    <text x="524" y="184">10 kΩ</text>
    <text x="524" y="200">2 W</text>
  </g>

  <!-- 설명 -->
  <rect x="790" y="340" width="390" height="236" fill="#f8fafc" stroke="#d5d9e0"/>
  <text x="806" y="366" font-size="13.5" font-weight="700" fill="#111827">역할</text>
  <g font-size="12.5" fill="#111827">
    <text x="806" y="392" font-weight="700" fill="#1d4ed8">LCD — 주 클램프</text>
    <text x="822" y="410" fill="#374151">누설 에너지를 입력으로 회생</text>
    <text x="806" y="436" font-weight="700" fill="#b45309">RCD — 안전망</text>
    <text x="822" y="454" fill="#374151">LCD가 못 잡는 스파이크와 과도 상황 흡수</text>
    <line x1="806" y1="472" x2="1164" y2="472" stroke="#d5d9e0"/>
    <text x="806" y="494" fill="#374151">시뮬레이션 (Lp 12 µH, 입력 37.6 V, 이상 소자)</text>
    <text x="806" y="514" fill="#374151">Vds 피크: LCD만 113.8 V → RCD 추가 112.9 V</text>
    <text x="806" y="534" fill="#374151">Rc 전압 약 75 V, 손실 0.56 W</text>
    <text x="806" y="554" fill="#374151">Rc 4.7 kΩ이면 112.1 V, 손실 1.16 W</text>
  </g>
</svg>
